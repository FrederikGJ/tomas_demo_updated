apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: microservice-system
build:
  local:
    push: false
  # The other services use the pre-built pesekt1/* images from Docker Hub.
  # The suspicious-dashboard is built locally (and loaded into kind automatically).
  artifacts:
    - image: suspicious-dashboard
      context: suspicious-dashboard
      sync:
        # Changes to the GUI are copied straight into the running pod - just reload the browser
        manual:
          - src: "public/**"
            dest: .
deploy:
  kubectl:
    manifests:
      - kubernetes/**/*.yaml
      - kubernetes/**/*.yml
portForward:
  - resourceType: service
    resourceName: rabbitmq-exporter
    namespace: default
    port: 9419
    localPort: 9419
  - resourceType: service
    resourceName: prometheus
    namespace: default
    port: 9090
    localPort: 9090
  - resourceType: service
    resourceName: suspicious-dashboard
    namespace: default
    port: 3004
    localPort: 3004
