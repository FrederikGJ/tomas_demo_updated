apiVersion: v1
kind: Service
metadata:
  name: suspicious-dashboard
spec:
  selector:
    app: suspicious-dashboard
  ports:
    - protocol: TCP
      port: 3004
      targetPort: 3004
      nodePort: 30010 # GUI: http://localhost:30010 (or http://localhost:3004 via the Skaffold port-forward)
  type: NodePort
